# Server Configuration
server.port=8080

# Application Name
spring.application.name=vaadin-ldap-app

# LDAP Configuration
spring.ldap.embedded.ldif=classpath:ldap-test-server.ldif
spring.ldap.embedded.base-dn=dc=example,dc=com
spring.ldap.embedded.port=8389

# For production LDAP server, uncomment and configure:
# spring.ldap.urls=ldap://localhost:389
# spring.ldap.base=dc=example,dc=com
# spring.ldap.username=cn=admin,dc=example,dc=com
# spring.ldap.password=admin

# R2DBC H2 Database Configuration
spring.r2dbc.url=r2dbc:h2:mem:///testdb?options=DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.r2dbc.username=sa
spring.r2dbc.password=

# H2 Console (for development)
spring.h2.console.enabled=true

# Vaadin Configuration
vaadin.productionMode=false
vaadin.whitelisted-packages=com.vaadin,org.vaadin,com.example.vaadinapp

# Logging
logging.level.root=INFO
logging.level.com.example.vaadinapp=DEBUG
logging.level.org.springframework.security=DEBUG
